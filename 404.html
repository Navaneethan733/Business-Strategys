<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Stackly</title>
  <meta name="description" content="Oops! The page you're looking for doesn't exist. Head back to Stackly." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Super Cool Preloader CSS -->
  <link rel="stylesheet" href="preloader.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 20s linear infinite;
      z-index: 0;
    }
    @keyframes gridDrift {
      0%   { background-position: 0 0; }
      100% { background-position: 60px 60px; }
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      animation: orbPulse 6s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(80,80,255,0.18) 0%, transparent 70%);
      top: -100px; left: -150px;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(180,80,255,0.12) 0%, transparent 70%);
      bottom: -80px; right: -100px;
      animation-delay: -3s;
    }
    @keyframes orbPulse {
      0%   { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.2) translate(20px, -30px); opacity: 1; }
    }
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0%   { transform: translateY(110vh); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .logo-wrap {
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeDown 0.7s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    }
    .logo-wrap img {
      height: 38px;
      width: auto;
      filter: invert(1);
    }
    .error-number-wrap {
      position: relative;
      margin-bottom: 8px;
    }
    .error-number {
      font-family: 'Inter', sans-serif;
      font-size: clamp(120px, 22vw, 220px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -8px;
      background: linear-gradient(135deg, #ffffff 0%, #555555 60%, #222222 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 2;
      opacity: 0;
      transform: scale(0.6) translateY(40px);
      animation: numberPop 1s cubic-bezier(0.175,0.885,0.32,1.275) 0.4s forwards;
      cursor: default;
      user-select: none;
    }
    @keyframes numberPop {
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .scanline {
      position: absolute;
      top: 0; left: -5%; right: -5%;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(120,100,255,0.8), transparent);
      z-index: 3;
      animation: scan 2.5s linear 1.5s infinite;
      border-radius: 2px;
    }
    @keyframes scan {
      0%   { top: 0%; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .divider {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      margin: 20px auto 28px;
      animation: lineExpand 0.9s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
    }
    @keyframes lineExpand {
      to { width: 280px; }
    }
    .headline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(22px, 4vw, 38px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1s forwards;
    }
    .subtext {
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.7;
      color: #888888;
      max-width: 440px;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1.15s forwards;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1.3s forwards;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      color: #000000;
      background: #ffffff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
      box-shadow: 0 8px 24px rgba(255,255,255,0.15);
    }
    .btn-home:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 16px 36px rgba(255,255,255,0.25);
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-back:hover {
      border-color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.06);
      transform: translateY(-3px);
    }
    .astronaut-wrap {
      position: fixed;
      top: 10%;
      right: 5%;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 1s ease 1.5s forwards, floatAstronaut 6s ease-in-out 2.5s infinite alternate;
    }
    .astronaut-svg {
      width: clamp(60px, 8vw, 110px);
      height: auto;
    }
    @keyframes floatAstronaut {
      0%   { transform: translateY(0) rotate(-5deg); }
      50%  { transform: translateY(-20px) rotate(3deg); }
      100% { transform: translateY(8px) rotate(-8deg); }
    }
    .bottom-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: #444;
      letter-spacing: 0.5px;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.8s forwards;
      white-space: nowrap;
      z-index: 10;
    }
    .bottom-hint span { color: #666; }
    @keyframes fadeUp   { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeDown { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn   { to { opacity: 1; } }
    @media (max-width: 600px) {
      .error-number { letter-spacing: -4px; }
      .astronaut-wrap { top: 5%; right: 2%; }
      .btn-group { flex-direction: column; width: 100%; max-width: 280px; }
      .btn-home, .btn-back { width: 100%; justify-content: center; }
      .orb-1 { width: 280px; height: 280px; }
      .orb-2 { width: 220px; height: 220px; }
      .logo-wrap { margin-bottom: 28px; }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       SITE PRELOADER
  ============================================================ -->

          <div class="preloader-progress-fill" id="preloader-progress-fill"></div>

  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>

      <ellipse cx="60" cy="52" rx="32" ry="34" fill="#e0e0e0"/>

      <circle cx="56" cy="50" r="1.2" fill="rgba(255,255,255,0.7)"/>

      <circle cx="50" cy="56" r="0.7" fill="rgba(255,255,255,0.6)"/>
      <ellipse cx="60" cy="84" rx="28" ry="6" fill="#cccccc"/>
      <rect x="34" y="84" width="52" height="52" rx="16" fill="#d4d4d4"/>
      <rect x="48" y="95" width="24" height="18" rx="6" fill="#b0b0b0"/>
      <circle cx="54" cy="101" r="3" fill="#6655ff"/>
      <circle cx="62" cy="101" r="3" fill="#ff5580"/>
      <circle cx="58" cy="108" r="2.5" fill="#55ddaa"/>
      <rect x="10" y="88" width="24" height="14" rx="7" fill="#d4d4d4" transform="rotate(15 10 88)"/>
      <rect x="86" y="88" width="24" height="14" rx="7" fill="#d4d4d4" transform="rotate(-15 86 88)"/>
      <circle cx="17" cy="105" r="8" fill="#cccccc"/>
      <circle cx="103" cy="105" r="8" fill="#cccccc"/>
      <rect x="40" y="130" width="16" height="24" rx="8" fill="#c8c8c8"/>
      <rect x="64" y="130" width="16" height="24" rx="8" fill="#c8c8c8"/>
      <rect x="36" y="148" width="22" height="10" rx="5" fill="#888"/>
      <rect x="62" y="148" width="22" height="10" rx="5" fill="#888"/>
      <ellipse cx="26" cy="116" rx="5" ry="3" fill="rgba(100,200,255,0.6)"/>
      <ellipse cx="94" cy="116" rx="5" ry="3" fill="rgba(100,200,255,0.6)"/>
    </svg>
  </div>

  <div class="content">
    <div class="logo-wrap">
      <img src="images/Frame 808.webp" alt="Stackly Logo" />
    </div>
    <div class="error-number-wrap">
      <div class="error-number" id="error-number">404</div>
      <div class="scanline"></div>
    </div>
    <div class="divider"></div>
    <h1 class="headline">Lost in the strategy space?</h1>
    <p class="subtext">The page you're looking for seems to have drifted off the map. Let us guide you back to where the growth happens.</p>
    <div class="btn-group">
      <a href="index.html" class="btn-home" id="btn-go-home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#000"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Go Home
      </a>
      <a href="javascript:history.back()" class="btn-back" id="btn-go-back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Go Back
      </a>
    </div>
  </div>

  <p class="bottom-hint">© 2025 Stackly &middot; <span>Strategic Marketing Solutions</span></p>

  <script>
    const container = document.getElementById('particles');
    const count = window.innerWidth < 600 ? 18 : 40;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 3 + 1;
      p.style.cssText = width:px;height:px;left:%;bottom:-10px;animation-duration:s;animation-delay:s;opacity:;
      container.appendChild(p);
    }

    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 30;
      const y = (e.clientY / window.innerHeight - 0.5) * 30;
      document.querySelector('.orb-1').style.transform = 	ranslate(px,px);
      document.querySelector('.orb-2').style.transform = 	ranslate(px,px);
    });

    document.getElementById('error-number').addEventListener('click', function() {
      this.style.transition = 'none';
      let flicker = 0;
      const iv = setInterval(() => {
        this.style.opacity = flicker % 2 === 0 ? '0.2' : '1';
        flicker++;
        if (flicker > 8) { clearInterval(iv); this.style.opacity = '1'; }
      }, 80);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') window.location.href = 'index.html';
    });
  </script>

  <!-- Super Cool Preloader Script -->
  <script src="preloader.js"></script>
</body>
</html>
