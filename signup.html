<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup | Stackly – Create Your Account</title>
  <meta name="description" content="Create your Stackly account to access business strategy tools, logistics support, and consulting services." />

  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />

  <!-- Super Cool Preloader CSS -->
  <link rel="stylesheet" href="preloader.css" />

  <style>
    /* ============================================================
       RESET & BASE STYLES
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #111111;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }



    /* ============================================================
       SCROLL & HERO ANIMATIONS
    ============================================================ */
    .anim-fade-up {
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .anim-fade-up.is-visible { opacity: 1; transform: translateY(0); }

    /* ============================================================
       SIGNUP SECTION WITH SKYSCRAPER BACKGROUND
    ============================================================ */
    .auth-section {
      margin-top: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-hero-container {
      position: relative;
      border-radius: 0;
      overflow: hidden;
      padding: 48px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-height: 100vh;
    }

    .auth-bg-img {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.75) contrast(1.05);
    }

    .auth-bg-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.65) 100%);
      z-index: 2;
    }

    .auth-content-wrapper {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Go Back Button */
    .go-back-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 16px;
    }
    .btn-go-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      color: #111;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      text-decoration: none;
    }
    .btn-go-back:hover {
      background: #ffffff;
      transform: translateX(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }

    /* Hero Text Above Box */
    .auth-hero-text {
      text-align: center;
      color: #ffffff;
      margin-bottom: 28px;
      max-width: 580px;
    }
    .auth-hero-text h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(26px, 3.2vw, 42px);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .auth-hero-text p {
      font-size: 14.5px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 6px rgba(0,0,0,0.3);
    }

    /* Floating White Card */
    .auth-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .auth-card h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      color: #111;
      margin-bottom: 24px;
      text-align: center;
    }

    .auth-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #111;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d0d0d0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13.5px;
      color: #222;
      background: #ffffff;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .form-group input::placeholder { color: #aaa; }
    .form-group input:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .checkbox-terms-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      font-size: 12.5px;
      color: #333;
    }
    .checkbox-terms-wrap input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #111;
      cursor: pointer;
      flex-shrink: 0;
    }
    .checkbox-terms-wrap label {
      cursor: pointer;
      line-height: 1.4;
    }
    .checkbox-terms-wrap a {
      font-weight: 700;
      color: #111;
      text-decoration: underline;
    }
    .checkbox-terms-wrap a:hover { color: #444; }

    .btn-auth-submit {
      width: 100%;
      padding: 13px 28px;
      font-size: 14.5px;
      font-weight: 600;
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.25s ease, transform 0.2s ease;
    }
    .btn-auth-submit:hover {
      background: #222222;
      transform: translateY(-2px);
    }

    .auth-bottom-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13.5px;
      color: #555;
    }
    .auth-bottom-text a {
      font-weight: 700;
      color: #111;
      text-decoration: underline;
      margin-left: 4px;
    }
    .auth-bottom-text a:hover { color: #444; }

    /* ============================================================
       SITE FOOTER (Identical to all pages)
    ============================================================ */
    .site-footer {
      background: #000000;
      color: #ffffff;
      padding: 50px 48px 80px;
      position: relative;
      overflow: hidden;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.3fr 1.1fr 0.7fr 0.9fr;
      gap: 48px;
      max-width: 1280px;
      margin: 0 auto 20px;
      position: relative;
      z-index: 2;
    }

    .footer-col-brand { display: flex; flex-direction: column; gap: 20px; }
    .footer-logo img { height: 36px; width: auto; filter: invert(1); }
    .footer-col-brand h3 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px; font-weight: 600; line-height: 1.3; color: #fff;
    }

    .newsletter-form { display: flex; align-items: center; gap: 10px; }
    .newsletter-input {
      padding: 10px 18px; border-radius: 50px; border: 1.5px solid #444;
      background: transparent; color: #fff; font-size: 13.5px; outline: none;
      width: 100%; max-width: 200px; transition: border-color 0.25s;
    }
    .newsletter-input:focus { border-color: #fff; }
    .newsletter-btn {
      padding: 10px 22px; border-radius: 50px; border: none;
      background: #fff; color: #000; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: background 0.25s;
    }
    .newsletter-btn:hover { background: #ddd; }

    .footer-brand-desc { font-size: 13px; line-height: 1.65; color: #aaa; max-width: 320px; }

    .footer-col-contact h4, .footer-col-links h4, .footer-col-social h4 {
      font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 18px;
    }
    .footer-contact-info {
      display: flex; flex-direction: column; gap: 12px;
      font-size: 13.5px; line-height: 1.6; color: #ccc;
    }
    .footer-nav-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-nav-list a { font-size: 14px; color: #ccc; transition: color 0.2s; }
    .footer-nav-list a:hover { color: #fff; }

    .social-icons { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .social-icon-link {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1.5px solid #444; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      color: #fff; transition: all 0.25s ease;
    }
    .social-icon-link:hover { background: #333; border-color: #666; transform: translateY(-2px); }
    .social-icon-link svg { width: 18px; height: 18px; fill: currentColor; }

    .footer-watermark {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 1; user-select: none; pointer-events: none;
      transform: translateY(30%);
    }
    .footer-watermark img {
      width: 100%; max-width: 100%; display: block;
      filter: brightness(2.5) contrast(0.5);
      mix-blend-mode: screen; opacity: 0.85;
    }

    /* ============================================================
       RESPONSIVE BREAKPOINTS
    ============================================================ */
    @media (max-width: 960px) {
      .navbar { padding: 0 24px; }
      .nav-links, .nav-actions { display: none; }
      .hamburger { display: flex; }

      .auth-section { padding: 24px 20px 48px; }
      .auth-hero-container { padding: 36px 18px 48px; min-height: auto; }
      .auth-card { padding: 32px 24px; }
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 36px; }
    }

    @media (max-width: 600px) {
      .auth-section { padding: 16px 12px 36px; }
      .auth-hero-container { padding: 28px 12px 36px; border-radius: 16px; }
      .auth-card { padding: 24px 18px; border-radius: 16px; }
      .footer-grid { grid-template-columns: 1fr; gap: 32px; }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       SITE PRELOADER
  ============================================================ -->
  <div id="site-preloader" class="site-preloader" aria-hidden="true">
    <div class="preloader-ambient-glow"></div>
    <div class="preloader-content-box">
      <div class="preloader-brand-wrapper">
        <div class="preloader-pulse-shadow"></div>
        <div class="preloader-spin-ring-outer"></div>
        <div class="preloader-spin-ring-inner"></div>
        <div class="preloader-logo-core">
          <img src="images/Frame 808.webp" alt="Stackly Logo" class="preloader-logo-img" />
        </div>
      </div>
      <div class="preloader-meta-wrap">
        <span class="preloader-brand-title">Stackly</span>
        <span class="preloader-brand-tagline">Strategic Growth &amp; Advisory</span>
      </div>
      <div class="preloader-progress-wrap">
        <div class="preloader-progress-track">
          <div class="preloader-progress-fill" id="preloader-progress-fill"></div>
        </div>
        <div class="preloader-percent-num" id="preloader-percent">0%</div>
      </div>
    </div>
  </div>

  <!-- MAIN SIGNUP HERO SECTION -->
  <section class="auth-section">
    <div class="auth-hero-container anim-fade-up">
      <img src="images/signup.webp" alt="Skyscraper Architecture Background" class="auth-bg-img" />
      <div class="auth-bg-overlay"></div>

      <div class="auth-content-wrapper">

        <!-- Go Back Button -->
        <div class="go-back-bar">
          <button type="button" class="btn-go-back" onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html';">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Go Back
          </button>
        </div>

        <!-- Top Header Text over Skyscraper Image -->
        <div class="auth-hero-text">
          <h1>Create your own account</h1>
          <p>Stackly is here to support your logistics needs every step of the way</p>
        </div>

        <!-- Floating White Card Container -->
        <div class="auth-card">
          <h2>Signup</h2>

          <form class="auth-form" id="signup-form">
            
            <!-- Name -->
            <div class="form-group">
              <label for="signup-name">Name</label>
              <input type="text" id="signup-name" placeholder="Enter your name" required />
            </div>

            <!-- Email -->
            <div class="form-group">
              <label for="signup-email">Email</label>
              <input type="email" id="signup-email" placeholder="Enter your email" required />
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="signup-password">Password</label>
              <input type="password" id="signup-password" placeholder="Enter your password" required />
            </div>

            <!-- Re-enter password -->
            <div class="form-group">
              <label for="signup-re-password">Re-enter password</label>
              <input type="password" id="signup-re-password" placeholder="Re-enter your password" required />
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="checkbox-terms-wrap">
              <input type="checkbox" id="agree-terms" required />
              <label for="agree-terms">I have read and agree to the <a href="404.html">Terms and conditions</a></label>
            </div>

            <button type="submit" class="btn-auth-submit">Signup</button>
          </form>

          <p class="auth-bottom-text">
            Already have an account? <a href="login.html">Login</a>
          </p>
        </div>

      </div>
    </div>
  </section>



  <!-- JAVASCRIPT -->
  <script>
    // Fade-in animation on load
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.anim-fade-up').forEach((el) => {
        setTimeout(() => el.classList.add('is-visible'), 60);
      });
    });

    // Handle signup form submission
    const signupForm = document.getElementById('signup-form');
    if (signupForm) {
      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const nameInput    = document.getElementById('signup-name');
        const emailInput   = document.getElementById('signup-email');
        const passInput    = document.getElementById('signup-password');
        const rePassInput  = document.getElementById('signup-re-password');

        const rawName  = nameInput  ? nameInput.value.trim()  : '';
        const rawEmail = emailInput ? emailInput.value.trim() : '';
        const rawPass  = passInput  ? passInput.value         : '';
        const rawRePass = rePassInput ? rePassInput.value     : '';

        if (!rawName) {
          alert('Please enter your name.');
          return;
        }
        if (!rawEmail) {
          alert('Please enter your email.');
          return;
        }
        if (!rawPass) {
          alert('Please enter a password.');
          return;
        }
        if (rawPass !== rawRePass) {
          alert('Passwords do not match. Please try again.');
          rePassInput.value = '';
          rePassInput.focus();
          return;
        }

        try {
          // Save credentials so login page can authenticate
          localStorage.setItem('stackly_reg_name',     rawName);
          localStorage.setItem('stackly_reg_email',    rawEmail);
          localStorage.setItem('stackly_reg_password', rawPass);
          localStorage.setItem('stackly_role',         'user');
        } catch (err) {
          console.warn('Storage unavailable', err);
        }

        // Redirect to login page
        window.location.href = 'login.html';
      });
    }
  </script>

  <!-- Super Cool Preloader Script -->
  <script src="preloader.js"></script>
</body>
</html>
